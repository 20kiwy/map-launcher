name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rust:
    name: tile-server ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: mini-services/map-launcher
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: mini-services/map-launcher

      - name: Build (release)
        run: cargo build --release --workspace

      - name: Test (release)
        run: cargo test --release --workspace

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          TAG="${GITHUB_REF_NAME}"
          DIR="dist/map-launcher-${TAG}"
          mkdir -p "$DIR/data"
          cp target/release/tile-server "$DIR/"
          cp target/release/tile-server-cli "$DIR/"
          cp ../../README-RELEASE.md "$DIR/README.txt"
          cp data/registry.json "$DIR/data/" 2>/dev/null || true
          tar czf "tile-server-${TAG}-linux-x64.tar.gz" -C dist "map-launcher-${TAG}"
          sha256sum "tile-server-${TAG}-linux-x64.tar.gz" > "tile-server-${TAG}-linux-x64.tar.gz.sha256"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $dir = "dist/map-launcher-$tag"
          New-Item -ItemType Directory -Force -Path "$dir/data" | Out-Null
          Copy-Item target/release/tile-server.exe "$dir/"
          Copy-Item target/release/tile-server-cli.exe "$dir/"
          Copy-Item ../../README-RELEASE.md "$dir/README.txt"
          Copy-Item data/registry.json "$dir/data/" -ErrorAction SilentlyContinue
          Copy-Item data/README.md "$dir/data/" -ErrorAction SilentlyContinue
          Compress-Archive -Path "dist/map-launcher-$tag/*" -DestinationPath "tile-server-$tag-windows-x64.zip"
          $h = (Get-FileHash "tile-server-$tag-windows-x64.zip" -Algorithm SHA256).Hash.ToLower()
          "$h  tile-server-$tag-windows-x64.zip" | Out-File -Encoding ascii "tile-server-$tag-windows-x64.zip.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tile-server-${{ matrix.os }}
          path: mini-services/map-launcher/tile-server-*
          if-no-files-found: error

  web:
    name: next.js web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Build (standalone)
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: bun run build

      - name: Package web bundle
        run: |
          TAG="${GITHUB_REF_NAME}"
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public
          cp README-WEB.md .next/standalone/README.txt
          cd .next/standalone
          zip -qr "../../map-launcher-web-${TAG}.zip" .
          cd ../..
          sha256sum "map-launcher-web-${TAG}.zip" > "map-launcher-web-${TAG}.zip.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: web
          path: map-launcher-web-*
          if-no-files-found: error

  release:
    name: github release
    needs: [rust, web]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*
