[workspace]
resolver = "2"
members = [
    "crates/carto-math",
    "crates/carto-style",
    "crates/carto-core",
    "crates/tile-server-core",
    "crates/tile-server-cli",
    "crates/tile-server",
]

[workspace.package]
version = "0.7.0"
edition = "2021"

[profile.release]
opt-level = 2
lto = false
codegen-units = 16
