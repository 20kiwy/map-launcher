[package]
name = "tile-server-core"
version.workspace = true
edition.workspace = true

[dependencies]
tiny-skia = "0.11"
fontdue = "0.9"
resvg = "0.45"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
include_dir = "0.7"
ureq = { version = "3", default-features = false, features = ["rustls"] }
carto-math = { path = "../carto-math" }
carto-style = { path = "../carto-style" }
carto-core = { path = "../carto-core" }
